<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Navidad Parque Field</title>
  <style>
    :root{--bg:#f4f5f7;--paper:#fff;--ink:#25272b;--muted:#747981;--line:#e3e5e8;--dark:#34373d;--soft:#eceef1;--accent:#60646c;--green:#4f7b65;--amber:#a8742c;--red:#ad554c;--shadow:0 16px 45px rgba(25,28,33,.13)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,Segoe UI,Arial,sans-serif}.app{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:235px;background:#292b2f;color:#fff;padding:26px 16px;display:flex;flex-direction:column;z-index:5}.brand{padding:0 12px 28px;font-size:17px;font-weight:750}.brand small{display:block;color:#aeb2b9;font-size:10px;letter-spacing:.12em;margin-top:6px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c9ccd1;padding:12px 14px;border-radius:9px;text-align:left;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#3b3e44;color:#fff}.user{margin-top:auto;border-top:1px solid #41444a;padding:18px 8px 0;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:#dfe2e6;color:#3e4248;font-size:10px;font-weight:800;flex:none}.user small{display:block;color:#aeb2b9;margin-top:3px}.main{margin-left:235px;min-width:0;width:100%}.top{height:74px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 3vw;position:sticky;top:0;z-index:4}.search{margin-left:auto;width:min(380px,45vw);border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fafafa}.search input{border:0;outline:0;background:transparent;width:100%}.content{padding:30px 3vw 60px;max-width:1600px;margin:auto}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:25px}.head small{color:var(--muted);font-weight:700;letter-spacing:.1em}.head h1{font-size:30px;margin:4px 0 5px}.head p{margin:0;color:var(--muted)}button{font:inherit}.primary{border:0;background:var(--dark);color:white;border-radius:8px;padding:12px 17px;cursor:pointer}.primary:hover{background:#202226}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.metric,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px}.metric{padding:21px}.metric span{color:var(--muted)}.metric b{display:block;font-size:36px;margin:12px 0 4px}.metric small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel h2{margin:0 0 14px;font-size:16px}.row{display:flex;align-items:center;gap:11px;border-top:1px solid var(--line);padding:13px 0}.row strong,.row small{display:block}.row small{color:var(--muted);margin-top:4px}.grow{flex:1}.pill{font-size:10px;font-weight:750;padding:5px 8px;border-radius:6px}.alta{background:#f4dcda;color:var(--red)}.media{background:#f2e5d0;color:var(--amber)}.baja{background:#dce9e1;color:var(--green)}.projectbar{height:7px;background:var(--soft);border-radius:8px;width:115px;overflow:hidden}.projectbar i{display:block;height:100%;background:#6e737b}.tools{display:flex;gap:10px;align-items:center;margin-bottom:18px}.tools select,.tools button{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 12px}.tools select{margin-left:auto}.kanban{display:grid;grid-template-columns:repeat(4,minmax(245px,1fr));gap:14px;overflow-x:auto;padding-bottom:16px}.column{background:#e9ebee;border-radius:12px;padding:12px;min-height:560px}.column.dragover{outline:2px dashed #777b82;outline-offset:-5px}.colhead{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 10px}.colhead h3{font-size:13px;margin:0}.count{background:white;border-radius:14px;padding:3px 7px;font-size:10px;margin-left:6px}.card{background:white;border:1px solid #dfe1e4;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 2px 7px rgba(30,35,40,.04);cursor:grab}.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,35,40,.08)}.card.dragging{opacity:.45}.card h4{font-size:13px;line-height:1.4;margin:13px 0 5px}.card p{font-size:11px;color:var(--muted);margin:0}.cardfoot{border-top:1px solid var(--line);margin-top:14px;padding-top:11px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}.add{border:1px dashed #b9bdc3;background:transparent;color:#666b73;width:100%;padding:10px;border-radius:8px;cursor:pointer}.empty{padding:45px;text-align:center;color:var(--muted)}.scrim{position:fixed;inset:0;background:rgba(20,22,25,.33);z-index:10}.drawer{position:fixed;right:0;top:0;height:100vh;width:min(505px,95vw);background:#fff;z-index:11;padding:25px 28px;overflow:auto;box-shadow:-15px 0 45px rgba(20,22,25,.16);animation:in .22s ease-out}.drawerhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.12em}.close{border:0;background:transparent;font-size:27px;cursor:pointer}.drawer h2{font-size:27px;margin:20px 0 6px}.drawer .project{color:var(--muted);margin-bottom:23px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:17px;background:#f6f7f8;border:1px solid var(--line);border-radius:10px;padding:17px}.fields label,.form label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:10px}.fields strong{color:var(--ink);font-size:12px}.fields select,.drawer textarea,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;background:white;padding:11px;font:inherit;color:var(--ink)}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}.section h3{font-size:12px}.drawer textarea{width:100%;resize:vertical}.comments{display:grid;gap:9px;margin-bottom:12px}.comment{display:flex;gap:9px;background:#f5f6f7;padding:12px;border-radius:9px}.comment p{margin:0;font-size:12px;line-height:1.45}.comment time{display:block;color:var(--muted);font-size:10px;margin-top:5px}.commentform{display:grid;gap:9px}.commentform .primary{justify-self:end}.modalwrap{position:fixed;inset:0;background:rgba(20,22,25,.4);z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(590px,100%);background:white;border-radius:14px;padding:25px;box-shadow:var(--shadow)}.modaltop{display:flex;justify-content:space-between}.modal h2{margin:0 0 20px}.form{display:grid;gap:14px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:13px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}.secondary{border:1px solid var(--line);background:white;border-radius:8px;padding:11px 16px}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:#303338;color:white;padding:13px 18px;border-radius:9px;z-index:30}@keyframes in{from{transform:translateX(100%)}to{transform:none}}
    @media(max-width:1000px){.side{width:82px}.brand{font-size:14px;padding-left:2px}.brand small,.nav button span,.user div{display:none}.nav button{text-align:center;font-size:18px}.main{margin-left:82px}.grid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(4,270px)}}
    @media(max-width:680px){.side{inset:auto 0 0;width:auto;height:65px;padding:6px;flex-direction:row}.brand,.user{display:none}.nav{display:flex;width:100%;justify-content:space-around}.nav button{padding:10px}.nav button:nth-child(n+6){display:none}.main{margin:0 0 65px}.top{height:62px}.content{padding:23px 14px}.metrics{grid-template-columns:1fr}.head h1{font-size:25px}.head .primary{padding:11px}.formrow{grid-template-columns:1fr}.search{width:45px}.search input{display:none}}
  </style>
  <style>.sync{font-size:11px;color:var(--muted);white-space:nowrap}.sync.online{color:var(--green)}.sync.error{color:var(--red)}.kanban{grid-template-columns:repeat(5,minmax(245px,1fr))}.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.userbutton{width:100%;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer}.logoutbtn{border:0;background:transparent;color:#aeb2b9;font-size:11px;text-align:left;padding:9px 8px 0;cursor:pointer}.logoutbtn:hover{color:white}.profilebutton{border:0;background:transparent;padding:0;cursor:pointer}.loginbox{width:min(720px,100%);background:#272a2f;color:white;border-radius:18px;padding:34px;box-shadow:var(--shadow);text-align:center;animation:profilePanel .35s ease-out}.loginbrand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:23px}.loginbrand .avatar{width:48px;height:48px;background:#fff;color:var(--dark)}.loginbox h2{font-size:29px;margin:0 0 6px}.loginbox>p{color:#b9bdc4;line-height:1.5}.loginprofiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:18px;margin-top:28px}.loginprofile{border:0;background:transparent;color:#d5d8dd;cursor:pointer;padding:10px;border-radius:15px;transition:transform .24s ease,background .24s ease,color .24s ease}.loginprofile:hover,.loginprofile:focus{background:#ffffff0c;color:white;outline:0;transform:translateY(-8px) scale(1.04)}.loginprofile .avatar{width:92px;height:92px;margin:0 auto 10px;background:#e5e7ea;color:#34373d;font-size:20px;border-radius:50%;border:3px solid transparent;transition:box-shadow .24s ease,border-color .24s ease,transform .24s ease}.loginprofile:hover .avatar,.loginprofile:focus .avatar{border-color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.38),0 0 0 5px rgba(255,255,255,.08);transform:scale(1.05)}.loginprofile strong,.loginprofile small{display:block}.loginprofile small{color:#92979f;margin-top:4px}.welcomesplash{width:min(520px,100%);background:white;border-radius:20px;padding:42px;text-align:center;box-shadow:var(--shadow);animation:welcomeCard .55s cubic-bezier(.2,.8,.2,1)}.welcomesplash .avatar{width:92px;height:92px;margin:0 auto 18px;background:var(--dark);color:white;font-size:22px;animation:welcomeAvatar .7s cubic-bezier(.2,.9,.2,1)}.welcomesplash h2{font-size:32px;margin:0 0 10px;animation:welcomeText .55s .12s both ease-out}.welcomesplash p{color:var(--muted);font-size:15px;line-height:1.6;margin:0;animation:welcomeText .55s .24s both ease-out}.sessiontag{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:11px}.sessiontag:before{content:'●';font-size:8px}.welcome{background:linear-gradient(135deg,#30343a,#50555e);color:white;border-radius:14px;padding:24px;margin-bottom:16px;display:flex;align-items:center;gap:17px}.welcome .avatar{width:58px;height:58px;background:#fff;color:var(--dark);font-size:15px}.welcome h2{font-size:24px;margin:0 0 5px}.welcome p{margin:0;color:#d5d8dd}.commenttask{color:var(--muted);font-size:10px;margin-bottom:4px}.photo-preview{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;border:1px solid var(--line)}.member-status{font-size:11px;color:var(--muted)}.member-status.current{color:var(--green);font-weight:700}@keyframes profilePanel{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}@keyframes welcomeCard{from{opacity:0;transform:scale(.78) translateY(25px)}to{opacity:1;transform:none}}@keyframes welcomeAvatar{0%{opacity:0;transform:scale(.45) rotate(-8deg)}70%{transform:scale(1.1) rotate(2deg)}100%{opacity:1;transform:none}}@keyframes welcomeText{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.loginbox,.loginprofile,.loginprofile .avatar,.welcomesplash,.welcomesplash .avatar,.welcomesplash h2,.welcomesplash p{animation:none!important;transition:none!important}}@media(max-width:1000px){.kanban{grid-template-columns:repeat(5,270px)}}@media(max-width:680px){.logoutbtn{display:none}.welcome{align-items:flex-start}.loginbox{padding:24px 17px}.loginprofiles{grid-template-columns:repeat(2,1fr)}.loginprofile .avatar{width:78px;height:78px}.welcomesplash{padding:30px 20px}}</style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand">NPF<small>NAVIDAD PARQUE FIELD</small></div><nav class="nav" id="nav"><button data-view="tareas" class="active">✓ <span>Mis tareas</span></button><button data-view="tablero">▦ <span>Tablero</span></button><button data-view="equipos">◎ <span>Equipo</span></button></nav><button class="user userbutton" id="sessionUser" onclick="showLogin(true)"><span class="avatar">—</span><div><strong>Elegir usuario</strong><small>Iniciar sesión</small></div></button><button class="logoutbtn" id="logoutButton" onclick="logoutSession()">↪ Cerrar sesión</button></aside>
  <main class="main"><header class="top"><strong id="mobileTitle">Mis tareas</strong><span id="syncStatus" class="sync">Conectando…</span><label class="search">⌕ <input id="search" placeholder="Buscar tareas..."></label><button class="profilebutton" id="topUserAvatar" onclick="showLogin(true)" title="Cambiar usuario"><span class="avatar">—</span></button></header><section class="content" id="content"></section></main>
</div>
<div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
const initial={
 projects:[],
 tasks:[],
 members:[]
};
const STORAGE_KEY='npf-data-v2',SESSION_KEY='npf-current-member',STATUSES=['Pendientes','En gestión','En diseño','Aprobados','Finalizados'];
const SUPABASE_URL='https://rlzmyuizjdvbvcyeruyq.supabase.co';
const SUPABASE_KEY='sb_publishable_F5l_0eQPnfZxUHecqyg2IA_C4HA--QX';
const saved=localStorage.getItem(STORAGE_KEY);let data=saved?JSON.parse(saved):structuredClone(initial);let view='tareas',selected=null,dragId=null,currentUser=null;
data.projects=data.projects||[];data.tasks=data.tasks||[];data.members=data.members||[];
const statusMigration={'Por hacer':'Pendientes','En curso':'En diseño','En revisión':'Aprobados','Finalizado':'Finalizados'};
data.tasks.forEach(t=>t.status=statusMigration[t.status]||t.status||'Pendientes');
const $=s=>document.querySelector(s), content=$('#content'), overlay=$('#overlay');let syncTimer;
function restoreSession(){const id=Number(sessionStorage.getItem(SESSION_KEY));currentUser=data.members.find(m=>m.id===id)||null}
function currentMember(){return currentUser?data.members.find(m=>m.id===currentUser.id)||currentUser:null}
function greeting(){const h=new Date().getHours(),word=h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches',m=currentMember();return `${word}${m?', '+m.name.split(' ')[0]:''}`}
function memberFrom(value){if(value&&typeof value==='object')return value;return data.members.find(m=>m.initials===value)||{initials:value||'—',name:value||'Sin asignar'} }
function avatar(value){const m=memberFrom(value),photo=m.photo?`<img src="${safe(m.photo)}" alt="${safe(m.name)}">`:safe(m.initials||'—');return `<span class="avatar">${photo}</span>`}
function renderSession(){const m=currentMember(),side=$('#sessionUser'),top=$('#topUserAvatar');if(!m){side.innerHTML='<span class="avatar">—</span><div><strong>Elegir usuario</strong><small>Iniciar sesión</small></div>';top.innerHTML='<span class="avatar">—</span>';return}side.innerHTML=`${avatar(m)}<div><strong>${safe(m.name)}</strong><small>${safe(m.role)} · Cambiar perfil</small></div>`;top.innerHTML=avatar(m)}
function showLogin(canClose=false){const members=data.members||[];overlay.innerHTML=`<div class="modalwrap" onclick="if(${canClose}&&event.target===this)closeOverlay()"><section class="loginbox"><div class="loginbrand"><span class="avatar">NPF</span><strong>NAVIDAD PARQUE FIELD</strong></div><h2>Seleccioná un usuario</h2><p>Elegí tu perfil para ver tus tareas y publicar comentarios con tu nombre.</p><div class="loginprofiles">${members.map(m=>`<button class="loginprofile" onclick="loginMember(${m.id})">${avatar(m)}<strong>${safe(m.name)}</strong><small>${safe(m.role)}</small></button>`).join('')||'<div class="empty" style="grid-column:1/-1;color:#b9bdc4">Todavía no hay integrantes cargados en Equipo.</div>'}</div>${canClose?'<button class="secondary" style="margin-top:25px" onclick="closeOverlay()">Cancelar</button>':''}</section></div>`}
function loginMember(id){const m=data.members.find(x=>x.id===id);if(!m)return;currentUser=m;sessionStorage.setItem(SESSION_KEY,String(id));m.lastLogin=new Date().toISOString();save();const first=safe(m.name.split(' ')[0]);overlay.innerHTML=`<div class="modalwrap"><section class="welcomesplash">${avatar(m)}<h2>¡Bienvenido, ${first}!</h2><p>Estas son las tareas que tenemos para vos.</p></section></div>`;setTimeout(()=>{overlay.innerHTML='';view='tareas';render()},1700)}
function logoutSession(){sessionStorage.removeItem(SESSION_KEY);currentUser=null;renderSession();content.innerHTML='<div class="empty">Sesión cerrada.</div>';showLogin()}
function syncState(text,state=''){const e=$('#syncStatus');e.textContent=text;e.className='sync '+state}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));clearTimeout(syncTimer);syncState('Guardando…');syncTimer=setTimeout(saveRemote,350)}
async function saveRemote(){try{const response=await fetch(`${SUPABASE_URL}/rest/v1/npf_workspace`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({id:1,data,updated_at:new Date().toISOString()})});if(!response.ok)throw new Error(await response.text());syncState('● Sincronizado','online')}catch(error){console.error('Error de sincronización:',error);syncState('Sin conexión a Supabase','error')}}
async function loadRemote(){try{const response=await fetch(`${SUPABASE_URL}/rest/v1/npf_workspace?id=eq.1&select=data`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!response.ok)throw new Error(await response.text());const rows=await response.json(),remote=rows[0]?.data,remoteHasData=remote&&((remote.projects||[]).length||(remote.tasks||[]).length||(remote.members||[]).length),localHasData=data.projects.length||data.tasks.length||data.members.length;if(remoteHasData||!localHasData){if(remote){data=remote;data.projects=data.projects||[];data.tasks=data.tasks||[];data.members=data.members||[];data.tasks.forEach(t=>t.status=statusMigration[t.status]||t.status||'Pendientes');localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}}else await saveRemote();restoreSession();render();if(!currentUser)showLogin();syncState('● Sincronizado','online')}catch(error){console.error('Error al conectar con Supabase:',error);syncState('Modo local','error');restoreSession();render();if(!currentUser)showLogin()}}
function toast(t){const e=$('#toast');e.textContent='✓ '+t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2100)}
function head(title,sub,button=true){return `<div class="head"><div><small>NAVIDAD PARQUE FIELD</small><h1>${title}</h1><p>${sub}</p></div>${button?'<button class="primary" onclick="newTask()">＋ Nueva tarea</button>':''}</div>`}
function pri(p){return `<span class="pill ${p.toLowerCase()}">${p}</span>`}
function render(){renderSession();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#mobileTitle').textContent=({tareas:'Mis tareas',tablero:'Tablero',equipos:'Equipo'})[view];if(!currentMember()){content.innerHTML='<div class="empty">Elegí un perfil para comenzar.</div>';return}({tareas:taskList,tablero:board,equipos:teams})[view]()}
function dashboard(){content.innerHTML=head('Buenos días, Matías','Este es el panorama de tus proyectos para hoy.')+`<div class="metrics"><article class="metric"><span>Proyectos activos</span><b>${data.projects.length}</b><small>Seguimiento general</small></article><article class="metric"><span>Tareas pendientes</span><b>${data.tasks.filter(t=>t.status!=='Finalizados').length}</b><small>${data.tasks.filter(t=>t.priority==='Alta'&&t.status!=='Finalizados').length} de alta prioridad</small></article><article class="metric"><span>Tareas finalizadas</span><b>${data.tasks.filter(t=>t.status==='Finalizados').length}</b><small>Actualizado automáticamente</small></article></div><div class="grid"><section class="panel"><h2>Proyectos recientes</h2>${data.projects.map(p=>`<div class="row"><div class="grow"><strong>${p.name}</strong><small>${p.area}</small></div><div class="projectbar"><i style="width:${p.progress}%"></i></div><b>${p.progress}%</b></div>`).join('')||'<div class="empty">Todavía no hay proyectos cargados.</div>'}</section><section class="panel"><h2>Próximas tareas</h2>${data.tasks.slice(0,5).map(t=>`<div class="row" onclick="openTask(${t.id})"><div class="grow"><strong>${t.title}</strong><small>${t.project}</small></div>${pri(t.priority)}${avatar(t.owner)}</div>`).join('')||'<div class="empty">Todavía no hay tareas cargadas.</div>'}</section></div>`}
function taskList(){const m=currentMember(),q=$('#search').value.toLowerCase(),mine=data.tasks.filter(t=>t.owner===m.initials),rows=mine.filter(t=>(t.title+' '+t.project).toLowerCase().includes(q)),pending=mine.filter(t=>t.status!=='Finalizados').length,done=mine.filter(t=>t.status==='Finalizados').length,recent=mine.flatMap(t=>(t.comments||[]).map(c=>({...c,taskId:t.id,taskTitle:t.title}))).slice(-5).reverse();content.innerHTML=`<section class="welcome">${avatar(m)}<div><h2>${safe(greeting())}</h2><p>Tenés ${pending} ${pending===1?'tarea pendiente':'tareas pendientes'} asignadas.</p></div></section><div class="metrics"><article class="metric"><span>Mis tareas</span><b>${mine.length}</b><small>Asignadas a ${safe(m.initials)}</small></article><article class="metric"><span>Pendientes</span><b>${pending}</b><small>${mine.filter(t=>t.priority==='Alta'&&t.status!=='Finalizados').length} de prioridad alta</small></article><article class="metric"><span>Finalizadas</span><b>${done}</b><small>Avance personal</small></article></div><div class="grid"><section class="panel"><h2>${rows.length} ${rows.length===1?'tarea':'tareas'} para vos</h2>${rows.map(t=>`<div class="row" onclick="openTask(${t.id})"><div class="grow"><strong>${safe(t.title)}</strong><small>${safe(t.project)} · ${safe(t.status)}</small></div><span>${safe(t.date)}</span>${pri(t.priority)}</div>`).join('')||'<div class="empty">No tenés tareas asignadas.</div>'}</section><section class="panel"><h2>Comentarios en mis tareas</h2>${recent.map(c=>`<div class="row" onclick="openTask(${c.taskId})">${avatar(c.initials)}<div class="grow"><div class="commenttask">${safe(c.taskTitle)}</div><strong>${safe(c.author)}</strong><small>${safe(c.text)}</small></div><time>${safe(c.date)}</time></div>`).join('')||'<div class="empty">Todavía no hay comentarios en tus tareas.</div>'}</section></div>`}
function board(){const filter=$('#projectFilter')?.value||'';content.innerHTML=head('Navidad Parque Field','Arrastrá las tarjetas entre columnas para actualizar su estado.')+`<div class="tools"><button>▦ Tareas</button><select id="projectFilter" onchange="board()"><option value="">Todos los proyectos</option>${data.projects.map(p=>`<option ${p.name===filter?'selected':''}>${p.name}</option>`).join('')}</select><button onclick="resetData()">Vaciar datos</button></div><div class="kanban">${STATUSES.map(s=>{const cards=data.tasks.filter(t=>t.status===s&&(!filter||t.project===filter));return `<section class="column" data-status="${s}" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" ondrop="dropCard(event,'${s}')"><div class="colhead"><h3>${s}<span class="count">${cards.length}</span></h3><button class="add" style="width:auto;padding:4px 8px" onclick="newTask('${s}')">＋</button></div>${cards.map(t=>`<article class="card" draggable="true" ondragstart="dragStart(event,${t.id})" ondragend="this.classList.remove('dragging')" onclick="openTask(${t.id})">${pri(t.priority)}<h4>${t.title}</h4><p>${t.project}</p><div class="cardfoot"><span>◇ ${t.date}</span>${avatar(t.owner)}</div></article>`).join('')}<button class="add" onclick="newTask('${s}')">＋ Agregar tarea</button></section>`}).join('')}</div>`}
function projects(){content.innerHTML=head('Proyectos','Avance general de cada iniciativa.',false)+`<div class="metrics">${data.projects.map(p=>`<article class="metric" onclick="view='tablero';render()"><span>${p.area}</span><b style="font-size:22px">${p.name}</b><div class="projectbar" style="width:100%"><i style="width:${p.progress}%"></i></div><small>${p.progress}% completado</small></article>`).join('')||'<section class="panel empty">Todavía no hay proyectos cargados.</section>'}</div>`}
function calendar(){content.innerHTML=head('Calendario','Vencimientos de tareas y reuniones.',false)+`<section class="panel"><h2>Próximos vencimientos</h2>${[...data.tasks].sort((a,b)=>a.id-b.id).map(t=>`<div class="row" onclick="openTask(${t.id})"><b style="width:60px">${t.date}</b><div class="grow"><strong>${t.title}</strong><small>${t.project}</small></div>${pri(t.priority)}</div>`).join('')||'<div class="empty">Todavía no hay vencimientos cargados.</div>'}</section>`}
function reports(){const done=data.tasks.filter(t=>t.status==='Finalizados').length,pct=data.tasks.length?Math.round(done/data.tasks.length*100):0;content.innerHTML=head('Informes','Indicadores de avance y cumplimiento.',false)+`<div class="metrics"><article class="metric"><span>Tareas totales</span><b>${data.tasks.length}</b></article><article class="metric"><span>Cumplimiento</span><b>${pct}%</b></article><article class="metric"><span>Alta prioridad</span><b>${data.tasks.filter(t=>t.priority==='Alta').length}</b></article></div><section class="panel" style="margin-top:16px"><h2>Progreso por proyecto</h2>${data.projects.map(p=>`<div class="row"><strong class="grow">${p.name}</strong><div class="projectbar" style="width:50%"><i style="width:${p.progress}%"></i></div><b>${p.progress}%</b></div>`).join('')||'<div class="empty">Todavía no hay información para mostrar.</div>'}</section>`}
function teams(){const me=currentMember();content.innerHTML=head('Equipo','Los perfiles de esta lista aparecen automáticamente al ingresar.',false)+`<div class="tools"><button class="primary" onclick="memberForm()">＋ Agregar integrante</button></div><section class="panel"><h2>Integrantes</h2>${data.members.map(m=>`<div class="row">${avatar(m)}<div class="grow"><strong>${safe(m.name)}</strong><small>${safe(m.role)} · ${data.tasks.filter(t=>t.owner===m.initials&&t.status!=='Finalizados').length} tareas pendientes</small></div><span class="member-status ${me?.id===m.id?'current':''}">${me?.id===m.id?'● Trabajando ahora':m.lastLogin?'Último acceso '+new Date(m.lastLogin).toLocaleDateString('es-AR'):'Sin ingresos'}</span><button class="secondary" onclick="memberForm(${m.id})">Editar</button><button class="secondary" onclick="deleteMember(${m.id})">Eliminar</button></div>`).join('')||'<div class="empty">Todavía no hay integrantes. Agregá el primero para crear los perfiles.</div>'}</section>`}
function memberForm(id){const m=data.members.find(x=>x.id===id);overlay.innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeOverlay()"><form class="modal" onsubmit="saveMember(event,${id||0})"><div class="modaltop"><h2>${m?'Editar':'Agregar'} integrante</h2><button type="button" class="close" onclick="closeOverlay()">×</button></div><div class="form"><div style="display:flex;align-items:center;gap:16px"><div id="mPhotoPreview" class="photo-preview">${m?avatar(m):'📷'}</div><label class="grow">Foto de perfil<input id="mPhoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewMemberPhoto(this)"><small>Se ajustará automáticamente para ocupar poco espacio.</small></label></div><label>Nombre completo<input id="mName" required value="${safe(m?.name||'')}" placeholder="Ej. Laura Sánchez"></label><div class="formrow"><label>Iniciales<input id="mInitials" required maxlength="3" value="${safe(m?.initials||'')}" placeholder="LS"></label><label>Rol<input id="mRole" required value="${safe(m?.role||'Integrante')}" placeholder="Ej. Diseño"></label></div><div class="actions"><button type="button" class="secondary" onclick="closeOverlay()">Cancelar</button><button class="primary">Guardar integrante</button></div></div></form></div>`}
function previewMemberPhoto(input){const file=input.files[0];if(!file)return;const url=URL.createObjectURL(file);$('#mPhotoPreview').innerHTML=`<img src="${url}" class="photo-preview" alt="Vista previa">`}
function resizeProfile(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(file.size>8*1024*1024)return reject(new Error('La foto supera los 8 MB'));const reader=new FileReader();reader.onerror=()=>reject(new Error('No se pudo leer la foto'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('La imagen no es válida'));img.onload=()=>{const size=256,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=canvas.height=size;const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function saveMember(e,id){e.preventDefault();const name=$('#mName').value.trim(),initials=$('#mInitials').value.trim().toUpperCase(),role=$('#mRole').value.trim(),file=$('#mPhoto').files[0];try{const photo=file?await resizeProfile(file):'';if(id){const m=data.members.find(x=>x.id===id),old=m.initials;Object.assign(m,{name,initials,role,...(photo?{photo}:{})});data.tasks.forEach(t=>{if(t.owner===old)t.owner=initials});if(currentUser?.id===id)currentUser=m}else data.members.push({id:Date.now(),name,initials,role,photo});save();closeOverlay();render();toast('Integrante guardado correctamente')}catch(error){toast(error.message||'No se pudo guardar la foto')}}
function deleteMember(id){const m=data.members.find(x=>x.id===id);if(!m||data.tasks.some(t=>t.owner===m.initials)){toast('No se puede eliminar: tiene tareas asignadas');return}if(confirm(`¿Eliminar a ${m.name} del equipo?`)){data.members=data.members.filter(x=>x.id!==id);if(currentUser?.id===id){currentUser=null;sessionStorage.removeItem(SESSION_KEY)}save();render();if(!currentUser)showLogin();toast('Integrante eliminado')}}
function dragStart(e,id){dragId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}function dropCard(e,status){e.preventDefault();const t=data.tasks.find(x=>x.id===dragId);if(t){t.status=status;save();board();toast('Tarea movida a '+status)}dragId=null}
function safe(value=''){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function commentsHTML(){const comments=selected.comments||[];return comments.map(c=>`<div class="comment">${avatar(c.initials||'—')}<p><strong>${safe(c.author||'Integrante')}</strong><br>${safe(c.text)}<time>${safe(c.date)}</time></p></div>`).join('')||'<div class="empty" style="padding:18px">Todavía no hay comentarios.</div>'}
function ownerOptions(current=''){const members=[...data.members];if(current&&!members.some(m=>m.initials===current))members.unshift({initials:current,name:current});return members.map(m=>`<option value="${safe(m.initials)}" ${m.initials===current?'selected':''}>${safe(m.name)} (${safe(m.initials)})</option>`).join('')}
function subtasksHTML(){const list=selected.subtasks||[],done=list.filter(x=>x.done).length;return `<div style="display:flex;justify-content:space-between;margin-bottom:10px"><strong>${done} de ${list.length} completadas</strong><span>${list.length?Math.round(done/list.length*100):0}%</span></div>${list.map(s=>`<div class="row" style="padding:9px 0"><input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask(${s.id})"><span class="grow" style="${s.done?'text-decoration:line-through;color:var(--muted)':''}">${safe(s.text)}</span><button class="close" style="font-size:18px" onclick="deleteSubtask(${s.id})">×</button></div>`).join('')||'<div class="empty" style="padding:15px">Todavía no hay subtareas.</div>'}`}
function attachmentsHTML(){const list=selected.attachments||[];return `${list.map(a=>`<div class="row" style="padding:9px 0"><span>${a.type==='link'?'🔗':'📎'}</span><a class="grow" href="${safe(a.url)}" target="_blank" rel="noopener">${safe(a.name)}</a><button class="close" style="font-size:18px" onclick="deleteAttachment(${a.id})">×</button></div>`).join('')||'<div class="empty" style="padding:15px">Todavía no hay archivos ni enlaces.</div>'}`}
function openTask(id){selected=data.tasks.find(t=>t.id===id);if(!selected)return;selected.comments=selected.comments||[];selected.subtasks=selected.subtasks||[];selected.attachments=selected.attachments||[];overlay.innerHTML=`<div class="scrim" onclick="closeOverlay()"></div><aside class="drawer"><div class="drawerhead">DETALLE DE LA TAREA<button class="close" onclick="closeOverlay()">×</button></div><h2>${selected.title}</h2><p class="project">□ ${selected.project}</p><div class="fields"><label>Responsable<select id="editOwner" onchange="updateTask()">${ownerOptions(selected.owner)}</select></label><label>Fecha límite<strong>${selected.date}</strong></label><label>Prioridad>${pri(selected.priority)}</label><label>Estado<select id="editStatus" onchange="updateTask()">${STATUSES.map(s=>`<option ${s===selected.status?'selected':''}>${s}</option>`).join('')}</select></label></div><section class="section"><h3>Descripción</h3><textarea id="editDescription" rows="5" oninput="updateTask()">${selected.description}</textarea></section><section class="section"><h3>Subtareas</h3><div id="subtasksList">${subtasksHTML()}</div><form class="commentform" onsubmit="addSubtask(event)"><input id="newSubtask" required placeholder="Nueva subtarea..." style="border:1px solid var(--line);border-radius:8px;padding:11px"><button class="secondary">＋ Agregar subtarea</button></form></section><section class="section"><h3>Archivos y enlaces</h3><div id="attachmentsList">${attachmentsHTML()}</div><div style="display:flex;gap:9px;flex-wrap:wrap"><input id="fileInput" type="file" hidden onchange="uploadFile(this)"><button class="secondary" onclick="$('#fileInput').click()">📎 Subir archivo</button><button class="secondary" onclick="addLink()">🔗 Agregar enlace</button></div></section><section class="section"><h3>Comentarios</h3><div id="commentsList" class="comments">${commentsHTML()}</div><form class="commentform" onsubmit="addComment(event)"><textarea id="newComment" rows="3" required placeholder="Escribí un comentario..."></textarea><button class="primary">Publicar comentario</button></form></section></aside>`}
function addSubtask(e){e.preventDefault();const input=$('#newSubtask'),text=input.value.trim();if(!text)return;selected.subtasks.push({id:Date.now(),text,done:false});save();$('#subtasksList').innerHTML=subtasksHTML();input.value='';toast('Subtarea agregada')}
function toggleSubtask(id){const item=selected.subtasks.find(x=>x.id===id);if(item)item.done=!item.done;save();$('#subtasksList').innerHTML=subtasksHTML()}
function deleteSubtask(id){selected.subtasks=selected.subtasks.filter(x=>x.id!==id);save();$('#subtasksList').innerHTML=subtasksHTML();toast('Subtarea eliminada')}
async function uploadFile(input){const file=input.files[0];if(!file)return;if(file.size>20*1024*1024){toast('El archivo supera el límite de 20 MB');input.value='';return}const clean=file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`tareas/${selected.id}/${Date.now()}_${clean}`;syncState('Subiendo archivo…');try{const response=await fetch(`${SUPABASE_URL}/storage/v1/object/npf-files/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!response.ok)throw new Error(await response.text());selected.attachments.push({id:Date.now(),name:file.name,type:'file',url:`${SUPABASE_URL}/storage/v1/object/public/npf-files/${path}`,path,date:new Date().toISOString()});save();$('#attachmentsList').innerHTML=attachmentsHTML();toast('Archivo subido correctamente')}catch(error){console.error(error);syncState('Error al subir archivo','error');toast('No se pudo subir el archivo')}input.value=''}
function addLink(){const url=prompt('Pegá la dirección completa del enlace:');if(!url)return;let parsed;try{parsed=new URL(url)}catch{toast('El enlace no es válido');return}if(!['http:','https:'].includes(parsed.protocol)){toast('Solo se permiten enlaces web');return}const name=prompt('Nombre para identificar el enlace:')||parsed.hostname;selected.attachments.push({id:Date.now(),name,type:'link',url:parsed.href,date:new Date().toISOString()});save();$('#attachmentsList').innerHTML=attachmentsHTML();toast('Enlace agregado')}
async function deleteAttachment(id){const item=selected.attachments.find(x=>x.id===id);if(!item)return;if(item.type==='file'&&item.path){try{const response=await fetch(`${SUPABASE_URL}/storage/v1/object/npf-files/${item.path}`,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!response.ok)throw new Error(await response.text())}catch(error){console.error(error);toast('No se pudo eliminar el archivo');return}}selected.attachments=selected.attachments.filter(x=>x.id!==id);save();$('#attachmentsList').innerHTML=attachmentsHTML();toast('Adjunto eliminado')}
function addComment(e){e.preventDefault();const input=$('#newComment'),text=input.value.trim(),m=currentMember();if(!text||!selected||!m)return;selected.comments=selected.comments||[];selected.comments.push({id:Date.now(),author:m.name,initials:m.initials,text,date:new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date())});save();$('#commentsList').innerHTML=commentsHTML();input.value='';toast(`Comentario publicado como ${m.name}`)}
function updateTask(){if(!selected)return;selected.owner=$('#editOwner').value;selected.status=$('#editStatus').value;selected.description=$('#editDescription').value;save()}function closeOverlay(){overlay.innerHTML='';selected=null;render()}
function newTask(status='Pendientes'){if(!data.members.length){view='equipos';render();toast('Primero agregá un integrante al equipo');return}overlay.innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeOverlay()"><form class="modal" onsubmit="createTask(event)"><div class="modaltop"><h2>Crear una tarea</h2><button type="button" class="close" onclick="closeOverlay()">×</button></div><div class="form"><label>Nombre<input id="fTitle" required placeholder="Ej. Preparar informe mensual"></label><div class="formrow"><label>Proyecto<select id="fProject">${data.projects.map(p=>`<option>${p.name}</option>`).join('')}</select></label><label>Responsable<select id="fOwner">${ownerOptions()}</select></label></div><div class="formrow"><label>Fecha límite<input id="fDate" type="date"></label><label>Prioridad<select id="fPriority"><option>Media</option><option>Alta</option><option>Baja</option></select></label></div><label>Estado<select id="fStatus">${STATUSES.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select></label><label>Descripción<textarea id="fDescription" rows="4"></textarea></label><div class="actions"><button type="button" class="secondary" onclick="closeOverlay()">Cancelar</button><button class="primary">Crear tarea</button></div></div></form></div>`}
function createTask(e){e.preventDefault();data.tasks.push({id:Date.now(),title:$('#fTitle').value,project:$('#fProject').value,date:$('#fDate').value||'Sin fecha',priority:$('#fPriority').value,owner:$('#fOwner').value,status:$('#fStatus').value,description:$('#fDescription').value||'Sin descripción.',comments:[],subtasks:[],attachments:[]});save();closeOverlay();toast('Tarea creada correctamente')}
function resetData(){if(confirm('¿Querés eliminar todos los datos cargados?')){data=structuredClone(initial);save();board();toast('El espacio de trabajo quedó vacío')}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#search').addEventListener('input',()=>{if(view!=='tareas')view='tareas';render()});render();loadRemote();
</script>
</body>
</html>
